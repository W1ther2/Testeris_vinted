name: Vinted deal finder (TESTAS)

# Testinis paleidimas: kitas botas, kita grupe, atskiri seen/state failai.
# Paleidziamas TIK ranka (Actions -> Vinted deal finder (TESTAS) -> Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: vinted-finder-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Butinai naujausia sakos busena, o ne ta, kuri buvo paleidimo SUKURIMO metu:
      # eileje laukes paleidimas kitaip gautu sena seen.json ir siustu tuos pacius skelbimus.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Testai cia nebeleidziami (kas 10 min. – tuscias laiko svaistymas): jie paleidziami
      # atskirai, kai ikeli nauja koda (.github/workflows/tests.yml).
      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      # Kaip ir pagrindiniame workflow: testine busena gyvena atskiroje sakoje,
      # kad neterstu kodo istorijos (zr. .github/workflows/vinted.yml).
      - name: Atsiusti testine busena
        env:
          STATE_BRANCH: busena-testas
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            for f in seen.test.json state.test.json; do
              if git show "FETCH_HEAD:$f" > "$f.gauta" 2>/dev/null; then mv "$f.gauta" "$f"; else rm -f "$f.gauta"; fi
            done
            echo "Testine busena paimta is sakos '$STATE_BRANCH'"
          else
            echo "Sakos '$STATE_BRANCH' dar nera – naudoju tai, kas repozitorijoje"
          fi

      - name: Paleisti (testinis botas)
        env:
          BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          CONFIG_FILE: config.test.json
          SEEN_FILE: seen.test.json
          STATE_FILE: state.test.json
        run: python vinted_deal_finder.py

      - name: Issaugoti testine busena
        if: always()
        env:
          STATE_BRANCH: busena-testas
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f seen.test.json ] && [ ! -f state.test.json ]; then echo "Nera ko saugoti"; exit 0; fi
          work=$(mktemp -d)
          for f in seen.test.json state.test.json; do [ -f "$f" ] && cp "$f" "$work/$f"; done
          cd "$work"
          git init -q -b "$STATE_BRANCH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Testine busena $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:refs/heads/$STATE_BRANCH"
          echo "Testine busena issaugota sakoje '$STATE_BRANCH'"
