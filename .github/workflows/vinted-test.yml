name: Vinted deal finder (TESTAS)

# Testinis paleidimas: kitas botas, kita grupe, atskiri seen/state failai.
# Paleidziamas TIK ranka (Actions -> Vinted deal finder (TESTAS) -> Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: vinted-finder-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Butinai naujausia sakos busena, o ne ta, kuri buvo paleidimo SUKURIMO metu:
      # eileje laukes paleidimas kitaip gautu sena seen.json ir siustu tuos pacius skelbimus.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Testai cia nebeleidziami (kas 10 min. – tuscias laiko svaistymas): jie paleidziami
      # atskirai, kai ikeli nauja koda (.github/workflows/tests.yml).
      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Paleisti (testinis botas)
        env:
          BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          CONFIG_FILE: config.test.json
          SEEN_FILE: seen.test.json
          STATE_FILE: state.test.json
        run: python vinted_deal_finder.py

      - name: Issaugoti testine busena
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Paleidimai vyksta po viena, tad sio paleidimo seen.test.json / state.test.json – naujausi.
          # Imam naujausia saka (su tavo pakeitimais, pvz. config.json) ir uzdedam savo busena.
          # Anksciau „git pull --rebase“ konfliktas tyliai numesdavo visa busena.
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/busena
          for f in seen.test.json state.test.json; do [ -f "$f" ] && cp "$f" /tmp/busena/; done
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for f in seen.test.json state.test.json; do [ -f "/tmp/busena/$f" ] && cp "/tmp/busena/$f" "$f" && git add "$f"; done
            if git diff --cached --quiet; then echo "Busena nepasikeite"; break; fi
            git commit -m "Testine busena"
            if git push origin "HEAD:$BRANCH"; then echo "Busena issaugota"; break; fi
            echo "Nepavyko issaugoti ($i) – bandau dar karta"; sleep $((i * 5))
          done
