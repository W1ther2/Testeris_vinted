name: Vinted deal finder

on:
  schedule:
    - cron: "*/10 * * * *"      # kas 10 min (GitHub realiai gali veluoti)
  workflow_dispatch:             # rankinis paleidimas

# Du paleidimai vienu metu nevyks (kitaip ateitu dublikatai)
concurrency:
  group: vinted-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Butinai naujausia sakos busena, o ne ta, kuri buvo paleidimo SUKURIMO metu:
      # eileje laukes paleidimas kitaip gautu sena seen.json ir siustu tuos pacius skelbimus.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Testai cia nebeleidziami (kas 10 min. – tuscias laiko svaistymas): jie paleidziami
      # atskirai, kai ikeli nauja koda (.github/workflows/tests.yml).
      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      # Busena gyvena ATSKIROJE sakoje "busena" ir ten visada lieka vienas commit'as.
      # Anksciau ji buvo commit'inama i kodo saka kas 10 min.: 144 commit'ai per diena po
      # ~1 MB, t. y. keli simtai MB per menesi, kuriu is git istorijos nebeistrinsi.
      # Jei sakos dar nera, imama tai, kas ikelta repozitorijoje – tad perejimas sklandus.
      - name: Atsiusti busena
        env:
          STATE_BRANCH: busena
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            for f in seen.json state.json; do
              if git show "FETCH_HEAD:$f" > "$f.gauta" 2>/dev/null; then mv "$f.gauta" "$f"; else rm -f "$f.gauta"; fi
            done
            echo "Busena paimta is sakos '$STATE_BRANCH'"
          else
            echo "Sakos '$STATE_BRANCH' dar nera – naudoju tai, kas repozitorijoje (pirmas kartas)"
          fi
          ls -l seen.json state.json 2>/dev/null || echo "(busenos failu dar nera – bus pilnas perziurejimas)"

      - name: Paleisti
        env:
          # GitHub Secrets: BOT – bot'o token'as is @BotFather, TEL – grupes chat ID.
          # Kodas juos gauna kaip BOT_TOKEN ir CHAT_ID (vinted/config.py).
          BOT_TOKEN: ${{ secrets.BOT }}
          CHAT_ID: ${{ secrets.TEL }}
        run: python vinted_deal_finder.py

      - name: Issaugoti busena
        if: always()
        env:
          STATE_BRANCH: busena
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Busena isauga atskiroje sakoje, kuri kas karta perrasoma (--force): joje visada
          # lieka VIENAS commit'as, tad nei kodo istorija, nei repozitorijos dydis nebeauga.
          # Paleidimai vyksta po viena (concurrency), tad varzytis del sakos nera su kuo.
          if [ ! -f seen.json ] && [ ! -f state.json ]; then echo "Nera ko saugoti"; exit 0; fi
          work=$(mktemp -d)
          for f in seen.json state.json; do [ -f "$f" ] && cp "$f" "$work/$f"; done
          cd "$work"
          git init -q -b "$STATE_BRANCH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Busena $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
                 "HEAD:refs/heads/$STATE_BRANCH"; then
              echo "Busena issaugota sakoje '$STATE_BRANCH'"; exit 0
            fi
            echo "Nepavyko issaugoti ($i) – bandau dar karta"; sleep $((i * 5))
          done
          echo "! Busenos issaugoti nepavyko – kitas paleidimas sius tuos pacius skelbimus"
          exit 1
