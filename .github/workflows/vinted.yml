name: Vinted deal finder

on:
  schedule:
    - cron: "*/10 * * * *"      # kas 10 min (GitHub realiai gali veluoti)
  workflow_dispatch:             # rankinis paleidimas

# Du paleidimai vienu metu nevyks (kitaip ateitu dublikatai)
concurrency:
  group: vinted-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Butinai naujausia sakos busena, o ne ta, kuri buvo paleidimo SUKURIMO metu:
      # eileje laukes paleidimas kitaip gautu sena seen.json ir siustu tuos pacius skelbimus.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Testai cia nebeleidziami (kas 10 min. – tuscias laiko svaistymas): jie paleidziami
      # atskirai, kai ikeli nauja koda (.github/workflows/tests.yml).
      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Paleisti
        env:
          # GitHub Secrets: BOT – bot'o token'as is @BotFather, TEL – grupes chat ID.
          # Kodas juos gauna kaip BOT_TOKEN ir CHAT_ID (vinted/config.py).
          BOT_TOKEN: ${{ secrets.BOT }}
          CHAT_ID: ${{ secrets.TEL }}
        run: python vinted_deal_finder.py

      - name: Issaugoti busena
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Paleidimai vyksta po viena, tad sio paleidimo seen.json / state.json – naujausi.
          # Imam naujausia saka (su tavo pakeitimais, pvz. config.json) ir uzdedam savo busena.
          # Anksciau „git pull --rebase“ konfliktas tyliai numesdavo visa busena.
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/busena
          for f in seen.json state.json; do [ -f "$f" ] && cp "$f" /tmp/busena/; done
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for f in seen.json state.json; do [ -f "/tmp/busena/$f" ] && cp "/tmp/busena/$f" "$f" && git add "$f"; done
            if git diff --cached --quiet; then echo "Busena nepasikeite"; break; fi
            git commit -m "Atnaujinta busena"
            if git push origin "HEAD:$BRANCH"; then echo "Busena issaugota"; break; fi
            echo "Nepavyko issaugoti ($i) – bandau dar karta"; sleep $((i * 5))
          done
