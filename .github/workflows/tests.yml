name: Testai

# Paleidziama, kai ikeli nauja koda. Nesekme matysi GitHub'e (raudonas X) ir gausi laiska,
# o botas (vinted.yml) dirba toliau su tuo, kas ikelta.
on:
  push:
    paths:
      - "vinted/**"
      - "tests/**"
      - "vinted_deal_finder.py"
      - "requirements.txt"
      - "config.json"
      - "config.test.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Testai
        run: python -m unittest discover -s tests -t .
